# Day 57: load balancing across three Java instances running on the host.
# Start them on 8081/8082/8083, then hit http://localhost:8080/

events {
    worker_connections 1024;
}

http {
    # Swap the strategy and watch the request distribution change.
    upstream backend {
        # Default: round robin.
        # least_conn;                       # send to the instance with fewest active connections
        # hash $remote_addr consistent;     # consistent hashing on client IP - sticky-ish
        server host.docker.internal:8081 max_fails=2 fail_timeout=5s;
        server host.docker.internal:8082 max_fails=2 fail_timeout=5s;
        server host.docker.internal:8083 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    log_format upstreamlog '$remote_addr -> $upstream_addr [$status] '
                           'rt=$request_time urt=$upstream_response_time "$request"';
    access_log /dev/stdout upstreamlog;

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # These three lines are most of what a load balancer does for reliability.
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /nginx-health {
            return 200 "ok\n";
        }
    }
}
