# The learning stack. Not needed until Day 41.
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml ps
#   docker compose -f infra/docker-compose.yml down -v      # -v also drops the data
#
# Tests use Testcontainers and start their own throwaway containers, so `mvn test`
# does not need this stack. This is for the days you want to poke around by hand.

name: system-design

services:

  postgres:
    image: postgres:16-alpine
    container_name: sd-postgres
    environment:
      POSTGRES_USER: sd
      POSTGRES_PASSWORD: sd
      POSTGRES_DB: systemdesign
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sd -d systemdesign"]
      interval: 5s
      timeout: 3s
      retries: 10
    # psql:  docker exec -it sd-postgres psql -U sd -d systemdesign

  redis:
    image: redis:7-alpine
    container_name: sd-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # cli:  docker exec -it sd-redis redis-cli

  kafka:
    # KRaft mode - no ZooKeeper needed.
    image: bitnami/kafka:3.9
    container_name: sd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafkadata:/bitnami/kafka
    # topics:  docker exec -it sd-kafka kafka-topics.sh --bootstrap-server localhost:9092 --list

  nginx:
    image: nginx:1.27-alpine
    container_name: sd-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Day 57 puts this in front of three Java instances on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sd-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: sd-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus
    # http://localhost:3000 - add Prometheus at http://prometheus:9090 as a datasource

volumes:
  pgdata:
  redisdata:
  kafkadata:
