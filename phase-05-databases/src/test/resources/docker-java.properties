# Workaround for docker-java (bundled inside Testcontainers 1.x) defaulting to a stale Docker
# API version (1.32) against modern Docker Engine releases (Docker Desktop 4.52+ / Engine 29+),
# which reject anything below API 1.40 outright. Pinning a modern, compatible version here
# skips docker-java's broken negotiation fallback. Harmless once upstream fixes it.
api.version=1.44
